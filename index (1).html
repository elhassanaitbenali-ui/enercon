<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ENERCON Status</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #F5F4F0;
  --card:     #FFFFFF;
  --ink:      #111110;
  --ink2:     #6B6A65;
  --ink3:     #B0AFA9;
  --line:     #E5E4DF;
  --amber:    #D97706;
  --amber-bg: #FEF3C7;
  --red:      #DC2626;
  --red-bg:   #FEE2E2;
  --blue:     #1D4ED8;
  --blue-bg:  #DBEAFE;
  --green:    #15803D;
  --green-bg: #DCFCE7;
  --shadow:   0 1px 3px rgba(0,0,0,.08), 0 4px 16px rgba(0,0,0,.06);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
  --r:        16px;
}

html, body {
  height: 100%;
  background: var(--bg);
  font-family: 'DM Sans', sans-serif;
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
}

body {
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* ── HEADER ── */
.app-header {
  padding: 16px 20px;
  display: flex;
  align-items: center;
  background: #1B5E2F;
}

.brand-logo {
  height: 36px;
  width: auto;
  display: block;
}

.brand-mark {
  width: 36px; height: 36px;
  background: var(--ink);
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.brand-mark svg { width: 20px; height: 20px; }

.brand-text {
  flex: 1;
}

.brand-text h1 {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.3px;
  line-height: 1;
  color: var(--ink);
}

.brand-text p {
  font-size: 11px;
  color: var(--ink3);
  font-family: 'DM Mono', monospace;
  margin-top: 2px;
  letter-spacing: 0.2px;
}

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  padding: 16px 20px 32px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  -webkit-overflow-scrolling: touch;
}

/* ── SEARCH CARD ── */
.search-card {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 20px;
  animation: slideUp .35s cubic-bezier(.16,1,.3,1) both;
}

.search-card label-group {
  display: block;
}

.field-label {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 6px;
  display: block;
}

.inputs-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
}

.field-wrap {
  flex: 1;
  display: flex;
  flex-direction: column;
}

.num-input {
  background: var(--bg);
  border: 1.5px solid var(--line);
  border-radius: 12px;
  font-family: 'DM Mono', monospace;
  font-size: 28px;
  font-weight: 500;
  color: var(--ink);
  padding: 12px 14px;
  width: 100%;
  outline: none;
  transition: border-color .2s, box-shadow .2s, background .2s;
  -webkit-appearance: none;
  appearance: none;
  line-height: 1;
}

.num-input::placeholder { color: var(--ink3); font-size: 24px; }
.num-input:focus {
  border-color: var(--ink);
  background: #fff;
  box-shadow: 0 0 0 3px rgba(17,17,16,.08);
}

.btn-search {
  background: var(--ink);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  font-weight: 600;
  letter-spacing: .2px;
  padding: 0 20px;
  height: 56px;
  cursor: pointer;
  display: flex; align-items: center; gap: 7px;
  flex-shrink: 0;
  transition: background .15s, transform .1s, box-shadow .15s;
  margin-top: 22px;
  white-space: nowrap;
  box-shadow: 0 2px 8px rgba(0,0,0,.15);
}

.btn-search:active {
  background: #333;
  transform: scale(.97);
  box-shadow: none;
}

.btn-search svg { width: 16px; height: 16px; }

/* ── EMPTY STATE ── */
.empty-state {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 40px 20px;
  text-align: center;
  animation: slideUp .4s .1s cubic-bezier(.16,1,.3,1) both;
}

.empty-icon {
  width: 56px; height: 56px;
  background: var(--bg);
  border-radius: 16px;
  display: flex; align-items: center; justify-content: center;
  margin: 0 auto 16px;
}

.empty-icon svg { width: 26px; height: 26px; opacity: .35; }

.empty-state h2 {
  font-size: 15px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
}

.empty-state p {
  font-size: 13px;
  color: var(--ink2);
  line-height: 1.6;
}

/* ── RESULT CARD ── */
.result-card {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow-lg);
  overflow: hidden;
  animation: slideUp .3s cubic-bezier(.16,1,.3,1) both;
}

/* Color bar at top */
.result-bar {
  height: 4px;
  width: 100%;
}
.result-bar.fault { background: linear-gradient(90deg, var(--red), #f87171); }
.result-bar.warn  { background: linear-gradient(90deg, var(--amber), #fbbf24); }
.result-bar.info  { background: linear-gradient(90deg, var(--blue), #60a5fa); }
.result-bar.ok    { background: linear-gradient(90deg, var(--green), #4ade80); }

.result-body { padding: 20px; }

/* Badge */
.status-pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border-radius: 99px;
  padding: 4px 12px 4px 8px;
  font-size: 12px;
  font-weight: 600;
  letter-spacing: .2px;
  margin-bottom: 18px;
}

.status-pill.fault { background: var(--red-bg);   color: var(--red); }
.status-pill.warn  { background: var(--amber-bg); color: var(--amber); }
.status-pill.info  { background: var(--blue-bg);  color: var(--blue); }
.status-pill.ok    { background: var(--green-bg); color: var(--green); }

.pill-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: currentColor;
}

.pill-dot.fault { animation: pulseDot 1.4s infinite; }

@keyframes pulseDot {
  0%,100% { opacity:1; transform: scale(1); }
  50%      { opacity:.5; transform: scale(.7); }
}

/* Descriptions */
.desc-block { margin-bottom: 20px; }

.desc-eyebrow {
  font-size: 11px;
  font-weight: 500;
  letter-spacing: .6px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 4px;
}

.desc-main-text {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.25;
  letter-spacing: -.3px;
}

.desc-sub-text {
  font-size: 20px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.25;
  letter-spacing: -.3px;
  margin-top: 2px;
  padding-left: 32px;
}

/* Divider */
.divider {
  height: 1px;
  background: var(--line);
  margin: 18px 0;
}

/* ID Row */
.id-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.id-chip {
  background: var(--bg);
  border-radius: 12px;
  padding: 12px 10px;
  text-align: center;
}

.id-chip-label {
  font-size: 10px;
  font-weight: 500;
  letter-spacing: .5px;
  text-transform: uppercase;
  color: var(--ink3);
  margin-bottom: 4px;
}

.id-chip-value {
  font-family: 'DM Mono', monospace;
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  line-height: 1;
}

.id-chip-value.board { font-size: 18px; color: var(--ink2); }

/* Footer ref */
.ref-line {
  margin-top: 16px;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--ink3);
  font-family: 'DM Mono', monospace;
  letter-spacing: .2px;
  line-height: 1.7;
  text-align: center;
}

/* ── ERROR ── */
.error-card {
  background: var(--card);
  border-radius: var(--r);
  box-shadow: var(--shadow);
  padding: 28px 20px;
  text-align: center;
  animation: slideUp .3s cubic-bezier(.16,1,.3,1) both;
}

.error-code {
  font-family: 'DM Mono', monospace;
  font-size: 42px;
  font-weight: 500;
  color: var(--red);
  line-height: 1;
  margin-bottom: 10px;
}

.error-card p {
  font-size: 14px;
  color: var(--ink2);
  line-height: 1.5;
}

.error-card strong { color: var(--ink); }

/* ── BOTTOM NAV HINT ── */
.app-footer {
  padding: 10px 20px max(16px, env(safe-area-inset-bottom));
  text-align: center;
  font-size: 11px;
  color: var(--ink3);
  font-family: 'DM Mono', monospace;
  flex-shrink: 0;
}


/* ── BOARD ID SOLO ── */
.id-row-single {
  display: flex;
  justify-content: center;
  margin-top: 4px;
}

.id-chip-solo {
  background: var(--bg);
  border-radius: 12px;
  padding: 10px 28px;
  text-align: center;
  min-width: 120px;
}

/* ── ANIMATIONS ── */
@keyframes slideUp {
  from { opacity: 0; transform: translateY(18px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ── DARK MODE ── */
@media (prefers-color-scheme: dark) {
  :root {
    --bg:    #0F0F0E;
    --card:  #1A1A19;
    --ink:   #F0EFE9;
    --ink2:  #8A8980;
    --ink3:  #4A4A45;
    --line:  #252522;
    --amber-bg: rgba(217,119,6,.15);
    --red-bg:   rgba(220,38,38,.15);
    --blue-bg:  rgba(29,78,216,.15);
    --green-bg: rgba(21,128,61,.15);
    --shadow:   0 1px 3px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.25);
    --shadow-lg:0 8px 32px rgba(0,0,0,.4);
  }
  .brand-mark { background: #F0EFE9; }
  .brand-mark svg path, .brand-mark svg circle, .brand-mark svg line { stroke: #0F0F0E !important; }
  .num-input { background: #252522; border-color: #2E2E2B; color: var(--ink); }
  .num-input:focus { background: #1A1A19; }
  .btn-search { background: #F0EFE9; color: #0F0F0E; }
  .btn-search:active { background: #ccc; }
}

/* ── RESPONSIVE ── */
@media (max-width: 380px) {
  .desc-main-text { font-size: 19px; }
  .id-chip-value { font-size: 18px; }
  .num-input { font-size: 24px; }
}
</style>

function searchFault() {
  const mainVal = document.getElementById('mainCode').value.trim();
  const subVal  = document.getElementById('subCode').value.trim();
  const el      = document.getElementById('result');

  if (!mainVal) {
    el.innerHTML = `<div class="error-card">
      <div class="error-code">!</div>
      <p>Veuillez entrer<br>un <strong>code principal</strong></p>
    </div>`;
    return;
  }

  const key   = subVal ? `${mainVal}.${subVal}` : mainVal;
  const fault = faultDB[key] || faultDB[mainVal];

  if (!fault) {
    el.innerHTML = `<div class="error-card">
      <div class="error-code">—</div>
      <p>Code <strong>${escHtml(key)}</strong> introuvable.<br>Vérifiez les codes saisis.</p>
    </div>`;
    return;
  }

  const cfg = {
    fault: { label: 'Fault',       dot: 'fault' },
    warn:  { label: 'Warning',dot: '' },
    info:  { label: 'Info',  dot: '' },
    ok:    { label: 'Operational', dot: '' },
  };
  const c = cfg[fault.type] || cfg.fault;
  const t = fault.type || 'fault';

  el.innerHTML = `<div class="result-card">
    <div class="result-bar ${t}"></div>
    <div class="result-body">

      <div class="status-pill ${t}">
        <span class="pill-dot ${c.dot}"></span>
        ${c.label}
      </div>

      <div class="desc-block">
        <div class="desc-eyebrow">Catégorie</div>
        <div class="desc-main-text">${escHtml(fault.main || '—')}</div>
      </div>

      <div class="desc-block">
        <div class="desc-eyebrow">Description</div>
        <div class="desc-sub-text">${escHtml(fault.sub)}</div>
      </div>

      <div class="divider"></div>

      <div class="id-row-single">
        <div class="id-chip-solo">
          <div class="id-chip-label">Board ID</div>
          <div class="id-chip-value board">${escHtml(fault.board || '—')}</div>
        </div>
      </div>

    </div>
  </div>`;

  // scroll result into view smoothly
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') searchFault();
});
